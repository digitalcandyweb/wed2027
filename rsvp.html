<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP – Claire & Brad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero small">
    <h1>RSVP</h1>
    <p class="subtitle">We can’t wait to celebrate with you</p>
  </header>

  <section class="details">
    <h2>Your Response</h2>
    <p>Please fill out the form below to let us know your plans.</p>

    <form action="/rsvp-submit" method="POST" class="rsvp-form" id="rsvpForm">
      <input type="hidden" name="form-name" value="wedding-rsvp">

      <label for="name">Full Name</label>
      <input id="name" type="text" name="name" required>

      <label for="email">Email Address</label>
      <input id="email" type="email" name="email" required>

      <label for="phone">Phone number (optional)</label>
      <input id="phone" type="tel" name="phone">

      <label for="event">Which event are you replying for?</label>
      <select id="event" name="event" required>
        <option value="">Loading events…</option>
      </select>

      <fieldset class="attendance">
        <legend>Will you be attending?</legend>
        <label class="radio-label"><input type="radio" name="attending" value="yes" required> Joyfully accepting</label>
        <label class="radio-label"><input type="radio" name="attending" value="no" required> Regretfully declining</label>
      </fieldset>

      <label for="guests">Number of Guests (including you)</label>
      <input id="guests" type="number" name="guests" min="1" max="10" value="1" required>

      <label for="message">Message (optional)</label>
      <textarea id="message" name="message" rows="4"></textarea>

      <button type="submit" class="button">Submit RSVP</button>
      <p id="rsvpStatus" class="section-intro" style="display:none;"></p>
    </form>

    <p class="contact-note">If you have any questions, feel free to email us at <strong>rsvp@digitalcandy.win</strong></p>
  </section>

  <section class="cta">
    <a href="index.html" class="button">Back to Home</a>
  </section>

  <footer>
    <p>© 2027 Claire & Brad Wedding</p>
  </footer>

  <script>
    (async function hydrateRsvpEvents(){
      const select = document.getElementById('event');
      try {
        const res = await fetch('/api/events', { headers: { 'Accept': 'application/json' } });
        const data = await res.json();
        const events = Array.isArray(data) ? data : (data.events || []);
        select.innerHTML = '<option value="">Please select…</option>';
        events.forEach(ev => {
          const opt = document.createElement('option');
          opt.value = ev.id;
          opt.textContent = ev.date ? `${ev.name} – ${ev.date}` : (ev.name || ev.id);
          select.appendChild(opt);
        });
      } catch (e) {
        select.innerHTML = '<option value="">Unable to load events</option>';
        console.error(e);
      }
    })();

    document.getElementById('rsvpForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.currentTarget;
      const status = document.getElementById('rsvpStatus');
      status.style.display = 'block';
      status.textContent = 'Submitting…';

      try {
        const body = new URLSearchParams(new FormData(form));
        const res = await fetch('/rsvp-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
          body
        });
        const out = await res.json();
        if (!res.ok) throw new Error(out?.error || 'Submit failed');
        status.textContent = 'Thank you! Your RSVP has been recorded.';
        form.reset();
      } catch (err) {
        status.textContent = 'Sorry — we could not submit your RSVP. Please try again.';
        console.error(err);
      }
    });
  </script>
</body>
</html>
