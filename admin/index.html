<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RSVP Admin Dashboard</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 40px;
      background: #fafafa;
      color: #333;
    }
    h1 {
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #f0f0f0;
      text-align: left;
      font-weight: 600;
    }
    tr:hover {
      background: #f9f9f9;
    }
    .timestamp {
      color: #777;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <h1>RSVP Admin Dashboard</h1>
  <p>Only visible to authenticated users via Cloudflare Access.</p>

  <table id="rsvp-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Event</th>
        <th>Guests</th>
        <th>Message</th>
        <th>Submitted</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadRSVPs() {
      const res = await fetch("/admin/api/list");
      const data = await res.json();

      const tbody = document.querySelector("#rsvp-table tbody");
      tbody.innerHTML = "";

      data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      for (const entry of data) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${entry.name}</td>
          <td>${entry.email}</td>
          <td>${entry.event}</td>
          <td>${entry.guests}</td>
          <td>${entry.message || ""}</td>
          <td class="timestamp">${new Date(entry.timestamp).toLocaleString()}</td>
        `;
        tbody.appendChild(row);
      }
    }

    loadRSVPs();
  </script>

</body>
</html>
