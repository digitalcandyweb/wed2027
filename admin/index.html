<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RSVP Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 20px;
      background: #f4f4f5;
      color: #222;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    input, select, button {
      font: inherit;
    }

    .search-input, .select {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.85rem;
    }

    .btn {
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-primary {
      background: #1f2937;
      color: #fff;
      border-color: #1f2937;
    }

    .btn-danger {
      background: #b91c1c;
      color: #fff;
      border-color: #b91c1c;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      font-size: 0.85rem;
    }

    th, td {
      padding: 6px 10px;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #f3f4f6;
      font-weight: 600;
    }

    tr:nth-child(even) td {
      background: #fafafa;
    }

    tr:hover td {
      background: #f0f0f0;
    }

    .timestamp {
      color: #6b7280;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 4px;
    }

    .message-cell {
      max-width: 200px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    @media (max-width: 800px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }
      thead { display: none; }
      tr {
        margin-bottom: 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      td {
        border: none;
        border-bottom: 1px solid #eee;
        padding-left: 40%;
        position: relative;
      }
      td::before {
        content: attr(data-label);
        position: absolute;
        left: 10px;
        top: 6px;
        font-weight: 600;
        color: #555;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>RSVP Admin</h1>
    <div class="controls">
      <input id="search" class="search-input" type="text" placeholder="Search…" />
      <select id="eventFilter" class="select">
        <option value="">All events</option>
      </select>
      <button id="exportCsv" class="btn">CSV</button>
      <button id="reload" class="btn btn-primary">Reload</button>
    </div>
  </header>

  <table id="rsvp-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Event</th>
        <th>Guests</th>
        <th>Message</th>
        <th>Submitted</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    let allRsvps = [];

    function applyFilters() {
      const search = document.getElementById("search").value.toLowerCase().trim();
      const eventFilter = document.getElementById("eventFilter").value;

      let filtered = [...allRsvps];

      if (eventFilter) {
        filtered = filtered.filter(r => (r.event || "") === eventFilter);
      }

      if (search) {
        filtered = filtered.filter(r => {
          const haystack = [
            r.name, r.email, r.event, r.guests, r.message
          ].map(x => (x || "").toLowerCase()).join(" ");
          return haystack.includes(search);
        });
      }

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.querySelector("#rsvp-table tbody");
      tbody.innerHTML = "";

      data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      for (const entry of data) {
        const tr = document.createElement("tr");
        const submitted = entry.timestamp ? new Date(entry.timestamp).toLocaleString() : "";

        tr.innerHTML = `
          <td data-label="Name">${entry.name || ""}</td>
          <td data-label="Email">${entry.email || ""}</td>
          <td data-label="Event">${entry.event || ""}</td>
          <td data-label="Guests">${entry.guests || ""}</td>
          <td data-label="Message" class="message-cell">${entry.message || ""}</td>
          <td data-label="Submitted" class="timestamp">${submitted}</td>
          <td data-label="Actions">
            <div class="actions">
              <button class="btn" data-action="resend" data-id="${entry.id}">↻</button>
              <button class="btn btn-danger" data-action="delete" data-id="${entry.id}">✕</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      }
    }

    async function loadRsvps() {
      const res = await fetch("/admin/api/list");
      const data = await res.json();
      allRsvps = data;

      const eventSelect = document.getElementById("eventFilter");
      const events = Array.from(new Set(allRsvps.map(r => r.event).filter(Boolean))).sort();
      eventSelect.innerHTML = '<option value="">All events</option>' +
        events.map(e => `<option value="${e}">${e}</option>`).join("");

      applyFilters();
    }

    async function handleActionClick(e) {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;

      const action = btn.dataset.action;
      const id = btn.dataset.id;

      if (action === "delete") {
        if (!confirm("Delete this RSVP?")) return;
        btn.disabled = true;
        await fetch("/admin/api/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id })
        });
        allRsvps = allRsvps.filter(r => r.id !== id);
        applyFilters();
      }

      if (action === "resend") {
        btn.disabled = true;
        btn.textContent = "…";
        await fetch("/admin/api/resend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id })
        });
        btn.textContent = "↻";
        btn.disabled = false;
      }
    }

    function exportCsv() {
      if (!allRsvps.length) return;

      const rows = [];
      rows.push(["id","name","email","number","event","guests","message","timestamp"]);

      for (const r of allRsvps) {
        rows.push([
          r.id || "",
          r.name || "",
          r.email || "",
          r.number || "",
          r.event || "",
          r.guests || "",
          (r.message || "").replace(/\r?\n/g, " "),
          r.timestamp || ""
        ]);
      }

      const csv = rows.map(row =>
        row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(",")
      ).join("\r\n");

      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "rsvps.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("search").addEventListener("input", applyFilters);
    document.getElementById("eventFilter").addEventListener("change", applyFilters);
    document.getElementById("exportCsv").addEventListener("click", exportCsv);
    document.getElementById("reload").addEventListener("click", loadRsvps);
    document.querySelector("#rsvp-table").addEventListener("click", handleActionClick);

    loadRsvps();
  </script>

</body>
</html>
