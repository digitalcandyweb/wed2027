<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RSVP Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 24px;
      background: #f5f5f7;
      color: #222;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 1.6rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    input, select, button {
      font: inherit;
    }
    .search-input {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      min-width: 200px;
    }
    .select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #fff;
      cursor: pointer;
    }
    .btn-primary {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }
    .btn-danger {
      background: #b91c1c;
      color: #fff;
      border-color: #b91c1c;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      vertical-align: top;
      font-size: 0.9rem;
    }
    th {
      background: #f3f4f6;
      text-align: left;
      font-weight: 600;
    }
    tr:hover td {
      background: #f9fafb;
    }
    .timestamp {
      color: #6b7280;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .message-cell {
      max-width: 260px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    @media (max-width: 800px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }
      thead {
        display: none;
      }
      tr {
        margin-bottom: 10px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        overflow: hidden;
      }
      td {
        border: none;
        border-bottom: 1px solid #e5e7eb;
        position: relative;
        padding-left: 40%;
      }
      td::before {
        position: absolute;
        left: 10px;
        top: 10px;
        width: 30%;
        font-weight: 600;
        color: #4b5563;
        white-space: nowrap;
      }
      td[data-label]:before {
        content: attr(data-label);
      }
      .actions {
        padding-bottom: 10px;
      }
    }
    .meta {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>RSVP Admin Dashboard</h1>
      <div class="meta">Protected by Cloudflare Access · Only authenticated users can view this.</div>
    </div>
    <div class="controls">
      <input id="search" class="search-input" type="text" placeholder="Search name, email, event, message…" />
      <select id="eventFilter" class="select">
        <option value="">All events</option>
      </select>
      <button id="exportCsv" class="btn">Export CSV</button>
      <button id="reload" class="btn btn-primary">Reload</button>
    </div>
  </header>

  <table id="rsvp-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Event</th>
        <th>Guests</th>
        <th>Message</th>
        <th>Submitted</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    let allRsvps = [];

    function applyFilters() {
      const search = document.getElementById("search").value.toLowerCase().trim();
      const eventFilter = document.getElementById("eventFilter").value;

      let filtered = [...allRsvps];

      if (eventFilter) {
        filtered = filtered.filter(r => (r.event || "") === eventFilter);
      }

      if (search) {
        filtered = filtered.filter(r => {
          const haystack = [
            r.name,
            r.email,
            r.event,
            r.guests,
            r.message
          ].map(x => (x || "").toString().toLowerCase()).join(" ");
          return haystack.includes(search);
        });
      }

      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.querySelector("#rsvp-table tbody");
      tbody.innerHTML = "";

      data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      for (const entry of data) {
        const tr = document.createElement("tr");

        const submitted = entry.timestamp ? new Date(entry.timestamp).toLocaleString() : "";

        tr.innerHTML = `
          <td data-label="Name">${entry.name || ""}</td>
          <td data-label="Email">${entry.email || ""}</td>
          <td data-label="Event">${entry.event || ""}</td>
          <td data-label="Guests">${entry.guests || ""}</td>
          <td data-label="Message" class="message-cell">${entry.message || ""}</td>
          <td data-label="Submitted" class="timestamp">${submitted}</td>
          <td data-label="Actions">
            <div class="actions">
              <button class="btn" data-action="resend" data-id="${entry.id}">Resend</button>
              <button class="btn btn-danger" data-action="delete" data-id="${entry.id}">Delete</button>
            </div>
          </td>
        `;

        tbody.appendChild(tr);
      }
    }

    async function loadRsvps() {
      const res = await fetch("/admin/api/list");
      const data = await res.json();
      allRsvps = data;

      const eventSelect = document.getElementById("eventFilter");
      const events = Array.from(new Set(allRsvps.map(r => r.event).filter(Boolean))).sort();
      eventSelect.innerHTML = '<option value="">All events</option>' +
        events.map(e => `<option value="${e}">${e}</option>`).join("");

      applyFilters();
    }

    async function handleActionClick(e) {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;

      const action = btn.dataset.action;
      const id = btn.dataset.id;
      if (!id) return;

      if (action === "delete") {
        if (!confirm("Delete this RSVP? This cannot be undone.")) return;
        btn.disabled = true;
        await fetch("/admin/api/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id })
        });
        allRsvps = allRsvps.filter(r => r.id !== id);
        applyFilters();
      }

      if (action === "resend") {
        btn.disabled = true;
        btn.textContent = "Resending…";
        await fetch("/admin/api/resend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id })
        });
        btn.textContent = "Resent";
        setTimeout(() => {
          btn.textContent = "Resend";
          btn.disabled = false;
        }, 1500);
      }
    }

    function exportCsv() {
      if (!allRsvps.length) return;

      const rows = [];
      rows.push(["id","name","email","number","event","guests","message","timestamp"]);

      for (const r of allRsvps) {
        rows.push([
          r.id || "",
          r.name || "",
          r.email || "",
          r.number || "",
          r.event || "",
          r.guests || "",
          (r.message || "").replace(/\r?\n/g, " "),
          r.timestamp || ""
        ]);
      }

      const csv = rows.map(row =>
        row.map(field => {
          const f = String(field).replace(/"/g, '""');
          return `"${f}"`;
        }).join(",")
      ).join("\r\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "rsvps.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.getElementById("search").addEventListener("input", applyFilters);
    document.getElementById("eventFilter").addEventListener("change", applyFilters);
    document.getElementById("exportCsv").addEventListener("click", exportCsv);
    document.getElementById("reload").addEventListener("click", loadRsvps);
    document.querySelector("#rsvp-table").addEventListener("click", handleActionClick);

    loadRsvps();
  </script>

</body>
</html>
