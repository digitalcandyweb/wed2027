<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RSVP Admin</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      background: #fdfaf5;
      color: #5a4a3f;
    }
    h1 { margin-bottom: 20px; }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 20px; 
      background: white;
    }
    th, td { 
      border: 1px solid #ccc; 
      padding: 10px; 
      text-align: left; 
    }
    th { background: #eee; }
  </style>
</head>
<body>

<h1>RSVP Responses</h1>

<table id="rsvp-table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Number</th>
      <th>Event</th>
      <th>Guests</th>
      <th>Message</th>
      <th>Timestamp</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
fetch("/admin/api/list")
  .then(r => r.json())
  .then(rows => {
    const tbody = document.querySelector("#rsvp-table tbody");
    rows.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.name}</td>
        <td>${r.email}</td>
        <td>${r.number || ""}</td>
        <td>${r.event}</td>
        <td>${r.guests}</td>
        <td>${r.message || ""}</td>
        <td>${r.timestamp}</td>
      `;
      tbody.appendChild(tr);
    });
  });
</script>

</body>
</html>
