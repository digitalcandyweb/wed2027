
<section class="section">
  <div class="section-header">
    <h2>Events</h2>
    <button class="button add-btn">+</button>
  </div>

  <div class="events-table-wrapper">
    <table class="events-table">
      <thead>
        <tr>
          <th>Order</th>
          <th>Name</th>
          <th>Date</th>
          <th>Location</th>
          <th class="actions-col">Actions</th>
        </tr>
      </thead>
      <tbody id="events-table-body">
        <!-- rows injected by JS -->
      </tbody>
    </table>
  </div>
</section>

<!-- Event Modal -->
<div id="event-modal" class="modal hidden">
  <div class="modal-content">
    <h2 id="event-modal-title">Edit Event</h2>

    <form id="event-form">
      <label>
        Event Name
        <input type="text" name="name">
      </label>

      <label>
        Date
        <input type="date" name="date">
      </label>

      <div class="location-group">
        <label>
          Location
          <select name="location"></select>
        </label>

        <label>
          Custom location name
          <input type="text" name="custom_location">
        </label>

        <label>
          Venue
          <input type="text" name="venue">
        </label>
      </div>

      <label>
        Description (public)
        <textarea name="description"></textarea>
      </label>

      <label>
        Event photos (one URL per line)
        <textarea name="photos"></textarea>
      </label>

      <label>
        Capacity (optional)
        <input type="number" name="capacity">
      </label>

      <label>
        Assign Vendors
        <select name="vendors" multiple></select>
      </label>

      <label>
        Event Timeline (one per line)
        <textarea name="timeline"></textarea>
      </label>

      <div class="modal-actions">
        <button type="button" class="button">Cancel</button>
        <button type="submit" class="button">Save</button>
      </div>
    </form>
  </div>
</div>
