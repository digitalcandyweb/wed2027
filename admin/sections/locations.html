
<div style="display:flex; gap:8px; align-items:center;">
  <button id="add-location-btn" class="button add-btn" title="Add location" aria-label="Add location">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <div class="muted">Reusable locations for events (maps, website, photos, description).</div>
</div>

<div class="locations-table-wrapper">
  <table class="locations-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Website</th>
        <th>Maps</th>
        <th>Photos</th>
        <th style="text-align:right;">Actions</th>
      </tr>
    </thead>
    <tbody id="locations-table-body">
      <tr class="empty"><td colspan="5" class="empty">No locations yet — add your first venue.</td></tr>
    </tbody>
  </table>
</div>

<!-- LOCATION MODAL -->
<div id="location-modal" class="modal hidden">
  <div class="modal-content">
    <h3 id="location-modal-title">Add Location</h3>

    <form id="location-form">
      <input type="hidden" id="location-id" />

      <label>
        Name
        <input id="location-name" class="input" placeholder="Waltham Forest Town Hall" />
      </label>

      <label>
        Area / City (optional)
        <input id="location-area" class="input" placeholder="Walthamstow / Perth / etc." />
      </label>

      <label>
        Description (shown on public site if event has no custom description)
        <textarea id="location-description" class="input" placeholder="A short description of the venue / area..."></textarea>
      </label>

      <label>
        Google Maps URL
        <input id="location-maps" class="input" placeholder="https://maps.google.com/..." />
      </label>

      <label>
        Website URL
        <input id="location-website" class="input" placeholder="https://..." />
      </label>

      <label>
        Photo URLs (one per line)
        <textarea id="location-photos" class="input" placeholder="https://...\nhttps://..."></textarea>
      </label>

      <div class="modal-actions">
        <button id="location-save" type="button" class="button save-btn" title="Save" aria-label="Save">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 13.5L4 10l1.4-1.4L7.5 10.7l7.1-7.1L16 5l-8.5 8.5z" fill="currentColor"/></svg>
        </button>

        <button id="location-cancel" type="button" class="button cancel-btn" title="Cancel" aria-label="Cancel">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- DELETE MODAL -->
<div id="location-delete-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Delete Location?</h3>
    <p>This cannot be undone.</p>
    <div class="modal-actions">
      <button id="location-confirm-delete" class="button delete-btn" title="Delete" aria-label="Delete">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M6 7h1v9H6V7zm3 0h1v9H9V7zm3 0h1v9h-1V7z" fill="currentColor"/><path d="M3 5h14v1H3V5zm2-2h8v1H5V3zm2 3h6v11H7V6z" fill="currentColor"/></svg>
      </button>
      <button id="location-cancel-delete" class="button cancel-btn" title="Cancel" aria-label="Cancel">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>
