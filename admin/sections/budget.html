<button id="add-expense-btn" class="button">Add Expense</button>

<div class="budget-table-wrapper">
  <table class="budget-table">
    <thead>
      <tr>
        <th>Order</th>
        <th>Category</th>
        <th>Description</th>
        <th>Amount</th>
        <th>Paid</th>
        <th>Date</th>
        <th>Notes</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="budget-table-body"></tbody>
  </table>
</div>

  <!-- BUDGET MODALS -->
  <div id="budget-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="budget-modal-title">Add Expense</h3>
      <input type="hidden" id="expense-id">
      <label>Category</label><input id="expense-category">
      <label>Description</label><input id="expense-description">
      <label>Amount</label><input id="expense-amount" type="number" step="0.01">
      <label>Date</label><input id="expense-date" type="date">
      <label class="checkbox-row"><input type="checkbox" id="expense-paid"> Paid</label>
      <label>Notes</label><textarea id="expense-notes"></textarea>
      <div class="modal-actions">
        <button id="save-expense-btn" class="button">Save</button>
        <button id="cancel-expense-btn" class="button secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="delete-expense-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Delete Expense?</h3>
      <p>This cannot be undone.</p>
      <div class="modal-actions">
        <button id="confirm-delete-expense-btn" class="button danger-btn">Delete</button>
        <button id="cancel-delete-expense-btn" class="button secondary">Cancel</button>
      </div>
    </div>
  </div>
