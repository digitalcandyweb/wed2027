<div class="settings-container">

  <!-- GENERAL SETTINGS -->
  <div class="settings-section">
    <button class="settings-accordion">General Settings</button>
    <div class="settings-panel">
      <label>Site Title</label>
      <input id="set-site-title" class="input">

      <label>Footer Text</label>
      <input id="set-footer-text" class="input">

      <label>Primary Accent Colour</label>
      <input id="set-accent" type="color" class="input">
    </div>
  </div>

  <!-- HERO SECTION -->
  <div class="settings-section">
    <button class="settings-accordion">Hero Section</button>
    <div class="settings-panel">
      <label>Hero Title</label>
      <input id="set-hero-title" class="input">

      <label>Hero Subtitle</label>
      <input id="set-hero-subtitle" class="input">

      <label>Hero Description</label>
      <textarea id="set-hero-description" class="input"></textarea>
    </div>
  </div>

  <!-- EVENT CONTENT BLOCKS -->
  <div class="settings-section">
    <button class="settings-accordion">Event Content Blocks</button>
    <div class="settings-panel" id="settings-event-blocks">
      <p class="settings-hint">Event-specific content will load here automatically.</p>

      <div class="settings-actions">
        <button id="event-block-add" class="button add-btn">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>

        <button id="event-block-save" class="button save-btn">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <path d="M7.5 13.5L4 10l1.4-1.4L7.5 10.7l7.1-7.1L16 5l-8.5 8.5z" fill="currentColor"/>
          </svg>
        </button>

        <button id="event-block-cancel" class="button cancel-btn">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <path d="M5 5l10 10M15 5L5 15" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

<!-- ADMIN PERMISSIONS -->
  <div class="settings-section">
    <button class="settings-accordion">Admin Permissions</button>
	<div class="settings-panel">
		<p class="settings-hint">
		 Control who can access the Admin area. One email per line. Changes take effect immediately.
		</p>

		<label>Admin Emails (full access)</label>
		<textarea id="set-admin-emails" class="input" style="height:120px;" placeholder="brad@example.com"></textarea>

		<label>Limited Emails (Budget + Planner only)</label>
		<textarea id="set-limited-emails" class="input" style="height:120px;" placeholder="wife@example.com"></textarea>

		<label class="checkbox-row">
		 <input type="checkbox" id="set-rbac-enabled" checked>
		 Enable role-based permissions (RBAC)
		</label>
	</div>
  </div>

  <!-- TRAVEL -->
  <div class="settings-section">
    <button class="settings-accordion">Travel Information</button>
    <div class="settings-panel">
      <label>Travel Overview</label>
      <textarea id="set-travel-overview" class="input"></textarea>

      <label>Airports</label>
      <textarea id="set-travel-airports" class="input"></textarea>

      <label>Transport Options</label>
      <textarea id="set-travel-transport" class="input"></textarea>
    </div>
  </div>

  <!-- ACCOMMODATION -->
  <div class="settings-section">
    <button class="settings-accordion">Accommodation</button>
    <div class="settings-panel">
      <label>Accommodation Overview</label>
      <textarea id="set-accom-overview" class="input"></textarea>

      <label>Recommended Hotels</label>
      <textarea id="set-accom-hotels" class="input"></textarea>
    </div>
  </div>

  <!-- FAQ -->
  <div class="settings-section">
    <button class="settings-accordion">FAQ</button>
    <div class="settings-panel">
      <label>FAQ Content (HTML allowed)</label>
      <textarea id="set-faq" class="input" style="height:200px;"></textarea>
    </div>
  </div>

  <!-- CUSTOM HTML BLOCKS -->
  <div class="settings-section">
    <button class="settings-accordion">Custom HTML Blocks</button>
    <div class="settings-panel">
      <label>Custom Block 1</label>
      <textarea id="set-custom-1" class="input" style="height:150px;"></textarea>

      <label>Custom Block 2</label>
      <textarea id="set-custom-2" class="input" style="height:150px;"></textarea>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="settings-actions">
	<button id="save-settings-btn" type="button" class="button save-btn" title="Save">
	  <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
		<path d="M7.5 13.5L4 10l1.4-1.4L7.5 10.7l7.1-7.1L16 5l-8.5 8.5z" fill="currentColor"/>
	  </svg>
	</button>

	<button id="settings-reset-btn" class="button cancel-btn" title="Reset to Defaults">
	  <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
		<path d="M4 4v4h4M16 16v-4h-4M5 15a7 7 0 1 1 10-10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
	  </svg>
	</button>
  </div>
</div>
