<div class="planner-controls">
	<button id="add-task-btn" class="button add-btn">
		<svg viewBox="0 0 20 20" fill="none">
			<path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
		</svg>
	</button>

  <select id="planner-status-filter" class="input">
    <option value="">All statuses</option>
    <option value="todo">To do</option>
    <option value="in_progress">In progress</option>
    <option value="done">Done</option>
  </select>

  <select id="planner-assigned-filter" class="input">
    <option value="">Assigned to</option>
    <option value="brad">Brad</option>
    <option value="claire">Claire</option>
    <option value="both">Both</option>
  </select>
</div>

<div class="planner-table-wrapper">
  <table class="planner-table">
    <thead>
      <tr>
        <th>Task</th>
        <th>Due</th>
        <th>Assigned</th>
        <th>Priority</th>
        <th>Status</th>
        <th>Event</th>
        <th style="text-align:right;">Actions</th>
      </tr>
    </thead>
    <tbody id="planner-table-body">
      <tr><td colspan="7" class="planner-loading">Loading tasks…</td></tr>
    </tbody>
  </table>
</div>

<!-- ADD / EDIT TASK MODAL -->
<div id="planner-modal" class="modal hidden">
  <div class="modal-content">
    <h3 id="planner-modal-title">Add Task</h3>

    <input type="hidden" id="task-id">

    <label>Task Title</label>
    <input id="task-title" class="input">

    <label>Description</label>
    <textarea id="task-description" class="input"></textarea>

    <label>Due Date</label>
    <input id="task-due" type="date" class="input">

    <label>Assigned To</label>
    <select id="task-assigned" class="input">
      <option value="brad">Brad</option>
      <option value="claire">Claire</option>
      <option value="both">Both</option>
    </select>

    <label>Priority</label>
    <select id="task-priority" class="input">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>

    <label>Status</label>
    <select id="task-status" class="input">
      <option value="todo">To do</option>
      <option value="in_progress">In progress</option>
      <option value="done">Done</option>
    </select>

    <label>Linked Event</label>
    <select id="task-event" class="input"></select>

    <label>Notes</label>
    <textarea id="task-notes" class="input"></textarea>

    <div class="modal-actions">
	  <button id="save-task-btn" class="button save-btn">
		<svg viewBox="0 0 20 20" fill="none">
			<path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
		</svg>
	  </button>
	  
	  <button id="cancel-task-btn" class="button cancel-btn">
		<svg viewBox="0 0 20 20" fill="none">
			<path d="M5 5l10 10M15 5L5 15" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
		</svg>
	  </button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div id="planner-delete-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Delete Task?</h3>
    <p>This cannot be undone.</p>
    <div class="modal-actions">

      <button id="confirm-delete-task-btn" class="button delete-btn">
        <svg viewBox="0 0 20 20" fill="none">
          <path d="M6 7h1v9H6V7zm3 0h1v9H9V7zm3 0h1v9h-1V7z" fill="currentColor"/>
          <path d="M3 5h14v1H3V5zm2-2h8v1H5V3zm2 3h6v11H7V6z" fill="currentColor"/>
        </svg>
        Delete
      </button>

      <button id="cancel-delete-task-btn" class="button cancel-btn">
		<svg viewBox="0 0 20 20" fill="none">
    <path d="M5 5l10 10M15 5L5 15" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
		</svg>
      </button>

    </div>
  </div>
</div>
