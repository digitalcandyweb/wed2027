<div class="planner-controls">
  <button id="add-task-btn" class="button add-btn" title="Add task" aria-label="Add task" type="button">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <select id="planner-status-filter" class="input" aria-label="Filter by status">
    <option value="">All statuses</option>
    <option value="todo">To do</option>
    <option value="in_progress">In progress</option>
    <option value="done">Done</option>
  </select>

  <select id="planner-assigned-filter" class="input" aria-label="Filter by assigned">
    <option value="">Assigned to</option>
    <option value="brad">Brad</option>
    <option value="claire">Claire</option>
    <option value="both">Both</option>
  </select>
</div>

<!-- Mobile card list -->
<div class="planner-cards" id="planner-cards" aria-live="polite">
  <div class="planner-loading">Loading tasks…</div>
</div>

<!-- Desktop table -->
<div class="planner-table-wrapper">
  <table class="planner-table">
    <thead>
      <tr>
        <th>Task</th>
        <th>Due</th>
        <th>Assigned</th>
        <th>Priority</th>
        <th>Status</th>
        <th>Event</th>
        <th class="actions-col">Actions</th>
      </tr>
    </thead>
    <tbody id="planner-table-body">
      <tr><td colspan="7" class="planner-loading">Loading tasks…</td></tr>
    </tbody>
  </table>
</div>

<!-- VIEW MODAL -->
<div id="planner-view-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Task</h3>
    <div class="view-grid">
      <div class="view-row"><div class="view-label">Title</div><div class="view-value" data-view="title"></div></div>
      <div class="view-row"><div class="view-label">Description</div><div class="view-value" data-view="description"></div></div>
      <div class="view-row"><div class="view-label">Due</div><div class="view-value" data-view="due"></div></div>
      <div class="view-row"><div class="view-label">Assigned</div><div class="view-value" data-view="assigned"></div></div>
      <div class="view-row"><div class="view-label">Priority</div><div class="view-value" data-view="priority"></div></div>
      <div class="view-row"><div class="view-label">Status</div><div class="view-value" data-view="status"></div></div>
      <div class="view-row"><div class="view-label">Event</div><div class="view-value" data-view="event"></div></div>
      <div class="view-row"><div class="view-label">Notes</div><div class="view-value" data-view="notes"></div></div>
    </div>
    <div class="modal-actions">
      <button id="close-task-view-btn" class="button cancel-btn">Close</button>
    </div>
  </div>
</div>

<!-- ADD / EDIT TASK MODAL -->
<div id="planner-modal" class="modal hidden">
  <div class="modal-content">
    <h3 id="planner-modal-title">Add Task</h3>
    <input type="hidden" id="task-id">

    <label>Task Title</label>
    <input id="task-title" class="input">

    <label>Description</label>
    <textarea id="task-description" class="input"></textarea>

    <label>Due Date</label>
    <input id="task-due" type="date" class="input">

    <label>Assigned To</label>
    <select id="task-assigned" class="input">
      <option value="brad">Brad</option>
      <option value="claire">Claire</option>
      <option value="both">Both</option>
    </select>

    <label>Priority</label>
    <select id="task-priority" class="input">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>

    <label>Status</label>
    <select id="task-status" class="input">
      <option value="todo">To do</option>
      <option value="in_progress">In progress</option>
      <option value="done">Done</option>
    </select>

    <label>Linked Event</label>
    <select id="task-event" class="input"></select>

    <label>Notes</label>
    <textarea id="task-notes" class="input"></textarea>

    <div class="modal-actions">
      <button id="save-task-btn" class="button save-btn" type="button" title="Save" aria-label="Save">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M7.5 13.5L4 10l1.4-1.4L7.5 10.7l7.1-7.1L16 5l-8.5 8.5z" fill="currentColor"/>
        </svg>
      </button>
      <button id="cancel-task-btn" class="button cancel-btn" type="button" title="Cancel" aria-label="Cancel">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<div id="planner-delete-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Delete Task?</h3>
    <p>This cannot be undone.</p>
    <div class="modal-actions">
      <button id="confirm-delete-task-btn" class="button delete-btn" type="button" title="Delete" aria-label="Delete">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M6 7h1v9H6V7zm3 0h1v9H9V7zm3 0h1v9h-1V7z" fill="currentColor"/>
          <path d="M3 5h14v1H3V5zm2-2h8v1H5V3zm2 3h6v11H7V6z" fill="currentColor"/>
        </svg>
      </button>
      <button id="cancel-delete-task-btn" class="button cancel-btn" type="button" title="Cancel" aria-label="Cancel">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>
