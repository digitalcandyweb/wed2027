<div style="display:flex; gap:8px; align-items:center;">
  <button id="add-contact-btn" class="button add-btn" title="Add contact" aria-label="Add contact">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <button id="import-contacts-btn" class="button export-btn" title="Import contacts CSV" aria-label="Import contacts CSV">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 17V8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M7 11l3-3 3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="4" y="3" width="12" height="3" fill="currentColor"/>
    </svg>
  </button>

  <input id="contacts-import-file" type="file" accept=".csv,text/csv" style="display:none;" />
</div>

<div class="contacts-table-wrapper">
  <table class="contacts-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Email</th>
        <th>Phone</th>
        <th style="text-align:right;">Actions</th>
      </tr>
    </thead>
    <tbody id="contacts-table-body"></tbody>
  </table>
</div>

<div class="muted" style="margin-top:6px;">
  Import CSV headers: name, role, email, phone, notes (notes optional).
</div>

<div id="contact-modal" class="modal hidden">
  <div class="modal-content">
    <h3 id="contact-modal-title">Add Contact</h3>
    <input type="hidden" id="contact-id">

    <label>Name</label>
    <input id="contact-name" class="input">

    <label>Role / Group</label>
    <input id="contact-role" class="input" placeholder="Bride family / Groom family / Vendor">

    <label>Email</label>
    <input id="contact-email" class="input" type="email">

    <label>Phone</label>
    <input id="contact-phone" class="input">

    <label>Notes</label>
    <textarea id="contact-notes" class="input" style="min-height:110px;"></textarea>

    <div class="modal-actions">
      <button id="contact-save" class="button save-btn" title="Save" aria-label="Save">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 13.5L4 10l1.4-1.4L7.5 10.7l7.1-7.1L16 5l-8.5 8.5z" fill="currentColor"/></svg>
      </button>
      <button id="contact-cancel" class="button cancel-btn" title="Cancel" aria-label="Cancel">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="contact-delete-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Delete Contact?</h3>
    <p>This cannot be undone.</p>
    <div class="modal-actions">
      <button id="contact-confirm-delete" class="button delete-btn" title="Delete" aria-label="Delete">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M6 7h1v9H6V7zm3 0h1v9H9V7zm3 0h1v9h-1V7z" fill="currentColor"/><path d="M3 5h14v1H3V5zm2-2h8v1H5V3zm2 3h6v11H7V6z" fill="currentColor"/></svg>
      </button>
      <button id="contact-cancel-delete" class="button cancel-btn" title="Cancel" aria-label="Cancel">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>
