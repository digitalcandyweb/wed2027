<div class="rsvp-controls">
  <input id="rsvp-search" type="text" placeholder="Search by name or email…" class="input" />
  <select id="rsvp-event-filter" class="input"></select>
  <select id="rsvp-attendance-filter" class="input">
    <option value="">All statuses</option>
    <option value="attending">Attending</option>
    <option value="not_attending">Not attending</option>
  </select>
	<button id="rsvp-export" class="button export-btn">
		<svg viewBox="0 0 20 20" fill="none">
			<path d="M10 3v9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
			<path d="M7 9l3 3 3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
			<rect x="4" y="14" width="12" height="3" fill="currentColor"/>
		</svg>
	</button>
</div>

<div class="rsvp-table-wrapper">
  <table class="rsvp-table">
    <thead>
      <tr>
        <th>Guest</th>
        <th>Email</th>
        <th>Event</th>
        <th>Guests</th>
        <th>Submitted</th>
        <th style="text-align:right;">Actions</th>
      </tr>
    </thead>
    <tbody id="rsvp-table-body">
      <tr><td colspan="6" class="rsvp-loading">Loading RSVPs…</td></tr>
    </tbody>
  </table>
</div>
